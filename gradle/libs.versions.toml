[versions]
raklib = "1.1.0.CR1-20260823.150315-6"
bedrock-codec = "3.0.0.Beta13-20260824.114016-17"
bedrock-connection = "3.0.0.Beta13-20260824.114016-17"
netease-protocol-extension = "1.21.124-R7"
log4j = "2.25.4"
jline = "3.30.6"
netty = "4.2.16.Final"
lombok = "1.18.30"

[libraries]
# Pin all Netty artifacts to a single version via BOM; keep it aligned with the version the MOT
# RakNet fork builds against (it switched to Netty 4.2), which would otherwise mix with transitive
# 4.1.x versions from the protocol libs.
netty-bom = { module = "io.netty:netty-bom", version.ref = "netty" }
bugsnag = { module = "com.bugsnag:bugsnag", version = "[3.0,4.0)" }
bstats-base = { module = "org.bstats:bstats-base", version = "3.0.1" }
yamler-core = { module = "net.cubespace:Yamler-Core", version = "2.5.0-20260728.033210-1" }
snakeyaml = { module = "org.yaml:snakeyaml", version = "2.6" }
gson = { module = "com.google.code.gson:gson", version = "2.10.1" }
fastutil = { module = "it.unimi.dsi:fastutil", version = "8.5.12" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version = "3.18.0" }
log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
disruptor = { module = "com.lmax:disruptor", version = "3.4.4" }
jline = { module = "org.jline:jline", version.ref = "jline" }
jline-terminal = { module = "org.jline:jline-terminal", version.ref = "jline" }
jline-terminal-jna = { module = "org.jline:jline-terminal-jna", version.ref = "jline" }
jline-reader = { module = "org.jline:jline-reader", version.ref = "jline" }
terminalconsoleappender = { module = "net.minecrell:terminalconsoleappender", version = "1.3.0" }
bedrock-codec = { module = "org.cloudburstmc.protocol:bedrock-codec", version.ref = "bedrock-codec" }
bedrock-connection = { module = "org.cloudburstmc.protocol:bedrock-connection", version.ref = "bedrock-connection" }
netease-protocol-extension = { module = "dev.mot.protocol:netease-protocol-extension", version.ref = "netease-protocol-extension" }
netty-transport-raknet = { module = "dev.mot.netty:netty-transport-raknet", version.ref = "raklib" }
netty-codec-haproxy = { module = "io.netty:netty-codec-haproxy", version.ref = "netty" }
netty-transport-native-epoll = { module = "io.netty:netty-transport-native-epoll", version.ref = "netty" }
netty-transport-native-kqueue = { module = "io.netty:netty-transport-native-kqueue", version.ref = "netty" }
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version = "9.37.4" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version = "5.10.2" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "1.10.2" }
mockito-core = { module = "org.mockito:mockito-core", version = "5.14.2" }

[plugins]
shadow = { id = "com.gradleup.shadow", version = "9.6.0" }
git-properties = { id = "com.gorylenko.gradle-git-properties", version = "4.0.1" }